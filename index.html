<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gubby</title>
<meta name="description" content="Gubby — a simple, private weight tracker.">
<meta name="theme-color" content="#FBF5F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151013" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gubby">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  :root {
    --bg: #FBF5F4; --card: #F5E6E7; --seg: #FFFFFF; --text: #2A1F25; --sub: #6E6268;
    --tint: #F6DDE6; --tint-text: #9A3A5C; --line: #D9789A; --dot: #F0C3D1; --grid: #EEDFE0;
    --accent: #B04A6E; --on-accent: #FFFFFF; --key: #FFFFFF; --handle: #E8CFD8;
    --seg-shadow: 0 1px 3px rgba(176,74,110,0.12);
    --key-shadow: 0 1px 2px rgba(176,74,110,0.08);
    --fab-shadow: 0 10px 24px rgba(176,74,110,0.35);
    --scrim: rgba(42,31,37,0.38);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151013; --card: #211A1E; --seg: #382B33; --text: #F5EEF1; --sub: #A99BA2;
      --tint: #3A2430; --tint-text: #F2B3C8; --line: #F0A0B8; --dot: #5A3C46; --grid: #2B2227;
      --accent: #E8A0B8; --on-accent: #151013; --key: #2A2126; --handle: #4A3A42;
      --seg-shadow: none; --key-shadow: none;
      --fab-shadow: 0 10px 28px rgba(232,160,184,0.25);
      --scrim: rgba(0,0,0,0.55);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  .app {
    max-width: 480px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 28px) 24px calc(env(safe-area-inset-bottom) + 140px);
    display: flex; flex-direction: column; gap: 24px;
  }
  header { display: flex; justify-content: space-between; align-items: center; }
  .eyebrow { font-size: 15px; font-weight: 500; color: var(--sub); letter-spacing: 0.01em; }
  h1 { margin: 2px 0 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 22px; border: none; background: var(--card);
    display: flex; align-items: center; justify-content: center; padding: 0;
  }

  .hero { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
  .big { display: flex; align-items: baseline; gap: 6px; }
  .big .num { font-size: 78px; font-weight: 300; letter-spacing: -0.04em; line-height: 1; }
  .big .unit { font-size: 22px; color: var(--sub); }
  .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 999px;
    background: var(--tint); color: var(--tint-text); font-size: 15px; font-weight: 600;
  }
  .pill.neutral { background: var(--card); color: var(--sub); }
  .pill svg { transition: transform .2s; }
  .pill.up svg { transform: rotate(180deg); }
  .muted { font-size: 15px; color: var(--sub); }

  .seg {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px;
    border-radius: 14px; background: var(--card);
  }
  .seg button {
    height: 38px; border: none; border-radius: 10px; background: transparent; color: var(--sub);
    font-size: 15px; font-weight: 500;
  }
  .seg button[aria-selected="true"] { background: var(--seg); color: var(--text); font-weight: 600; box-shadow: var(--seg-shadow); }

  figure { margin: 0; display: flex; flex-direction: column; gap: 6px; }
  #chart { width: 100%; height: 190px; display: block; overflow: visible; }
  #chart text { font-size: 11px; fill: var(--sub); font-family: inherit; }
  figcaption { display: flex; justify-content: space-between; font-size: 13px; color: var(--sub); min-height: 16px; }
  .chart-empty { height: 190px; display: flex; align-items: center; justify-content: center; color: var(--sub); font-size: 15px; border-radius: 16px; background: var(--card); }

  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .stat { display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 16px; background: var(--card); }
  .stat span:first-child { font-size: 12px; font-weight: 500; color: var(--sub); text-transform: uppercase; letter-spacing: 0.06em; }
  .stat span:last-child { font-size: 20px; font-weight: 600; }
  .stat .good { color: var(--tint-text); }

  .history h2 { margin: 0 0 6px; font-size: 15px; font-weight: 600; color: var(--sub); }
  .history ul { list-style: none; margin: 0; padding: 0; }
  .row {
    width: 100%; display: flex; justify-content: space-between; align-items: center; min-height: 52px;
    border: none; border-bottom: 1px solid var(--grid); background: transparent; padding: 0; text-align: left;
  }
  .row .when { display: flex; gap: 10px; align-items: baseline; }
  .row .day { font-size: 17px; font-weight: 500; }
  .row .time { font-size: 15px; color: var(--sub); }
  .row .kg { font-size: 17px; font-weight: 600; }
  .row .kg small { font-size: 17px; font-weight: 400; color: var(--sub); }
  .more { margin-top: 12px; height: 44px; width: 100%; border: none; border-radius: 14px; background: var(--card); color: var(--sub); font-size: 15px; font-weight: 500; }

  .empty { text-align: center; padding: 72px 12px 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .empty img { width: 160px; height: 160px; }
  .empty h2 { margin: 8px 0 0; font-size: 24px; font-weight: 600; }
  .empty p { margin: 0; font-size: 17px; color: var(--sub); line-height: 1.45; max-width: 280px; }

  .fab-wrap {
    position: fixed; left: 0; right: 0; bottom: 0; height: calc(132px + env(safe-area-inset-bottom));
    background: linear-gradient(to bottom, transparent, var(--bg) 55%);
    display: flex; justify-content: center; align-items: flex-start; padding-top: 34px; pointer-events: none;
  }
  .fab {
    pointer-events: auto; width: 64px; height: 64px; border-radius: 32px; border: none;
    background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center;
    box-shadow: var(--fab-shadow); transition: transform .15s;
  }
  .fab:active { transform: scale(0.94); }

  .scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 10; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 50%; bottom: 0; width: 100%; max-width: 480px; z-index: 11;
    transform: translate(-50%, 105%); transition: transform .32s cubic-bezier(.2,.8,.2,1);
    background: var(--bg); border-radius: 28px 28px 0 0;
    padding: 10px 20px calc(env(safe-area-inset-bottom) + 20px);
    display: flex; flex-direction: column; gap: 18px;
  }
  .sheet.on { transform: translate(-50%, 0); }
  .handle { align-self: center; width: 40px; height: 5px; border-radius: 3px; background: var(--handle); }
  .sheet-head { display: grid; grid-template-columns: 80px 1fr 80px; align-items: center; }
  .sheet-head h2 { margin: 0; text-align: center; font-size: 19px; font-weight: 600; }
  .text-btn { height: 44px; border: none; background: transparent; color: var(--sub); font-size: 17px; font-weight: 500; padding: 0 4px; text-align: left; }
  .text-btn.danger { color: var(--tint-text); text-align: right; }

  .chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .chip {
    position: relative; height: 48px; border-radius: 14px; background: var(--card);
    display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 500;
  }
  .chip svg { color: var(--tint-text); }
  .chip input {
    -webkit-appearance: none; appearance: none; border: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 16px; font-weight: 500; padding: 0; margin: 0; height: 44px; min-width: 0;
    text-align: center; cursor: pointer; outline: none;
  }
  #dateIn { width: 8.6em; } #timeIn { width: 6.4em; }
  .chip input::-webkit-date-and-time-value { text-align: center; }
  .chip input::-webkit-calendar-picker-indicator { display: none; }
  .chip:focus-within { box-shadow: 0 0 0 2px var(--accent); }

  .readout { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0; }
  .readout .big .num { font-size: 76px; }
  .readout .num.placeholder { color: var(--sub); opacity: 0.45; }
  .caret { width: 2px; height: 58px; background: var(--accent); align-self: center; border-radius: 1px; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .hint { font-size: 15px; color: var(--sub); min-height: 20px; }

  .pad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; user-select: none; -webkit-user-select: none; }
  .pad button { height: 54px; border: none; border-radius: 14px; background: var(--key); box-shadow: var(--key-shadow); font-size: 27px; font-weight: 400; }
  .pad button.ghost { background: transparent; box-shadow: none; display: flex; align-items: center; justify-content: center; }
  .pad button:active { background: var(--card); }

  .primary { height: 56px; border: none; border-radius: 18px; background: var(--accent); color: var(--on-accent); font-size: 18px; font-weight: 600; box-shadow: var(--fab-shadow); transition: opacity .2s; }
  .primary:disabled { opacity: 0.4; box-shadow: none; }

  .menu-list { display: flex; flex-direction: column; gap: 8px; }
  .menu-item { height: 56px; border: none; border-radius: 16px; background: var(--card); font-size: 17px; font-weight: 500; display: flex; align-items: center; gap: 12px; padding: 0 18px; }
  .menu-item svg { color: var(--tint-text); }
  .menu-note { font-size: 13px; color: var(--sub); text-align: center; margin: 0; line-height: 1.4; }

  .toast {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 16px); z-index: 20;
    transform: translate(-50%, -20px); opacity: 0; transition: all .25s; pointer-events: none;
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 15px; font-weight: 500;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Cheer-up pop-up ---------- */
  .cheer { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
    background: var(--scrim); opacity: 0; transition: opacity .25s; padding: 24px; }
  .cheer.on { opacity: 1; }
  .cheer-card { overflow: hidden; width: min(340px, 100%); background: var(--bg); border-radius: 28px; padding: 16px 24px 24px;
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px;
    transform: scale(.85) translateY(24px); transition: transform .45s cubic-bezier(.2,1.4,.4,1); }
  .cheer.on .cheer-card { transform: none; }
  .cheer-art svg { width: 190px; height: 190px; overflow: visible; display: block; }
  .cheer h2 { margin: 0; font-size: 27px; font-weight: 700; letter-spacing: -0.01em; }
  .cheer p { margin: 0; font-size: 17px; color: var(--sub); line-height: 1.4; }
  .cheer .pill { margin-top: 6px; }
  .cheer .primary { margin-top: 14px; width: 100%; }

  /* Gubby's moves */
  .cheer-art svg * { transform-box: view-box; }
  .cheer-art svg .fb { transform-box: fill-box; transform-origin: center; }
  .g-sprout { transform-origin: 100px 58px; animation: g-wiggle 1.2s ease-in-out infinite; }
  .g-confetti { animation: g-fall 1.8s linear infinite; opacity: 0; }
  .g-spark { animation: g-twinkle 1.4s ease-in-out infinite; }
  .g-heart { animation: g-float 2.4s ease-out infinite; }
  .g-note { animation: g-float 2s ease-out infinite; }
  .g-z { animation: g-float 2.6s ease-out infinite; }
  /* 1 jump */
  .pose-jump .g-body { transform-origin: 100px 184px; animation: g-jump .9s ease-in-out infinite; }
  .pose-jump .g-shadow { transform-origin: 100px 186px; animation: g-shadow .9s ease-in-out infinite; }
  .pose-jump .g-armL { transform-origin: 40px 112px; animation: g-waveL .45s ease-in-out infinite alternate; }
  .pose-jump .g-armR { transform-origin: 160px 112px; animation: g-waveR .45s ease-in-out infinite alternate; }
  /* 2 thumbs-up + wink */
  .pose-thumbs .g-body { transform-origin: 100px 184px; animation: g-bob 1.2s ease-in-out infinite; }
  .pose-thumbs .g-thumb { transform-origin: 158px 120px; animation: g-thumb .6s ease-in-out infinite alternate; }
  /* 3 run */
  .pose-run .g-body { transform-origin: 100px 184px; animation: g-run .32s ease-in-out infinite alternate; }
  .pose-run .g-armL { transform-origin: 42px 118px; animation: g-swing .32s ease-in-out infinite alternate; }
  .pose-run .g-armR { transform-origin: 158px 118px; animation: g-swing .32s ease-in-out infinite alternate-reverse; }
  .pose-run .g-footL { animation: g-step .32s ease-in-out infinite alternate; }
  .pose-run .g-footR { animation: g-step .32s ease-in-out infinite alternate-reverse; }
  .g-speed { animation: g-dash .5s linear infinite; }
  /* 4 dance */
  .pose-dance .g-body { transform-origin: 100px 184px; animation: g-dance 1s ease-in-out infinite; }
  .pose-dance .g-armL { transform-origin: 40px 112px; animation: g-waveL .5s ease-in-out infinite alternate; }
  .pose-dance .g-armR { transform-origin: 160px 112px; animation: g-waveL .5s ease-in-out infinite alternate-reverse; }
  /* 5 twirl */
  .pose-twirl .g-body { transform-origin: 100px 120px; animation: g-twirl 2.2s ease-in-out infinite; }
  /* 6 fist pump */
  .pose-pump .g-body { transform-origin: 100px 184px; animation: g-bob 1.4s ease-in-out infinite; }
  .pose-pump .g-pump { transform-origin: 162px 112px; animation: g-pump .7s ease-in-out infinite; }
  /* 7 sunrise */
  .pose-sunrise .g-body { transform-origin: 100px 184px; animation: g-nod 1.6s ease-in-out infinite; }
  .g-sun { animation: g-rise 3s ease-out infinite; }
  .g-rays { transform-origin: 160px 64px; animation: g-spin 6s linear infinite; }
  /* 8 hug */
  .pose-hug .g-body { transform-origin: 100px 184px; animation: g-squeeze 1.2s ease-in-out infinite; }
  .g-bigheart { transform-origin: 100px 146px; animation: g-pulse 1.2s ease-in-out infinite; }
  /* 9 chart */
  .pose-chart .g-body { transform-origin: 100px 184px; animation: g-bob 1.6s ease-in-out infinite; }
  .pose-chart .g-point { transform-origin: 42px 112px; animation: g-poke .5s ease-in-out infinite alternate; }
  .g-trend { stroke-dasharray: 120; animation: g-draw 2.6s ease-in-out infinite; }
  /* 10 sleepy */
  .pose-sleepy .g-body { transform-origin: 100px 184px; animation: g-breathe 3s ease-in-out infinite; }
  .pose-sleepy .g-sprout { animation-duration: 3s; }
  /* same weight */
  .pose-steady .g-body { transform-origin: 100px 184px; animation: g-sway 2.4s ease-in-out infinite; }

  @keyframes g-wiggle { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  @keyframes g-jump { 0%,100% { transform: translateY(0) scale(1.05,.95); } 45% { transform: translateY(-18px) scale(.97,1.03); } }
  @keyframes g-shadow { 0%,100% { transform: scale(1); } 45% { transform: scale(.72); opacity: .6; } }
  @keyframes g-waveL { from { transform: rotate(-14deg); } to { transform: rotate(16deg); } }
  @keyframes g-waveR { from { transform: rotate(14deg); } to { transform: rotate(-16deg); } }
  @keyframes g-fall { 0% { transform: translateY(-20px) rotate(0); opacity: 0; } 12% { opacity: 1; } 100% { transform: translateY(160px) rotate(320deg); opacity: 0; } }
  @keyframes g-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes g-pump { 0%,100% { transform: rotate(10deg); } 50% { transform: rotate(-16deg); } }
  @keyframes g-twinkle { 0%,100% { transform: scale(.3); opacity: 0; } 50% { transform: scale(1); opacity: 1; } }
  @keyframes g-sway { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
  @keyframes g-float { 0% { transform: translateY(12px) scale(.6); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-34px) scale(1); opacity: 0; } }
  @keyframes g-thumb { from { transform: rotate(4deg); } to { transform: rotate(-10deg); } }
  @keyframes g-run { from { transform: translateY(0) rotate(6deg); } to { transform: translateY(-7px) rotate(6deg); } }
  @keyframes g-swing { from { transform: rotate(-35deg); } to { transform: rotate(35deg); } }
  @keyframes g-step { from { transform: translateY(0); } to { transform: translateY(-9px); } }
  @keyframes g-dash { 0% { transform: translateX(10px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateX(-18px); opacity: 0; } }
  @keyframes g-dance { 0%,100% { transform: rotate(-9deg) translateY(0); } 25% { transform: rotate(0) translateY(-12px); } 50% { transform: rotate(9deg) translateY(0); } 75% { transform: rotate(0) translateY(-12px); } }
  @keyframes g-twirl { 0% { transform: scaleX(1); } 25% { transform: scaleX(-1); } 50%,100% { transform: scaleX(1); } }
  @keyframes g-nod { 0%,60%,100% { transform: rotate(0) translateY(0); } 30% { transform: rotate(3deg) translateY(2px); } }
  @keyframes g-rise { 0% { transform: translateY(26px); opacity: 0; } 40%,100% { transform: translateY(0); opacity: 1; } }
  @keyframes g-spin { to { transform: rotate(360deg); } }
  @keyframes g-squeeze { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04,.96); } }
  @keyframes g-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
  @keyframes g-poke { from { transform: rotate(0); } to { transform: rotate(-10deg); } }
  @keyframes g-draw { 0% { stroke-dashoffset: 120; } 60%,100% { stroke-dashoffset: 0; } }
  @keyframes g-breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03,.97); } }
  @media (prefers-reduced-motion: reduce) { .cheer-art * { animation: none !important; } .g-confetti, .g-spark, .g-heart, .g-note, .g-z { opacity: 1; } .g-trend { stroke-dashoffset: 0; } }
</style>
</head>
<body>

<main class="app">
  <header>
    <div>
      <div class="eyebrow" id="today"></div>
      <h1>Gubby</h1>
    </div>
    <button class="icon-btn" id="menuBtn" aria-label="Export or import data">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
    </button>
  </header>

  <section class="empty" id="empty" hidden>
    <img src="icons/gubby.png" alt="" width="160" height="160">
    <h2>Hi, I’m Gubby</h2>
    <p>Tap the + button below to log your first weigh-in. I’ll keep track of your progress here.</p>
  </section>

  <div id="dash" hidden>
    <div style="display:flex;flex-direction:column;gap:24px">
      <section class="hero">
        <div class="big"><span class="num" id="latest">–</span><span class="unit">kg</span></div>
        <div class="meta">
          <span class="pill" id="delta" hidden>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M6 13l6 6 6-6"/></svg>
            <span id="deltaText"></span>
          </span>
          <span class="muted" id="avg"></span>
        </div>
      </section>

      <section style="display:flex;flex-direction:column;gap:16px">
        <div class="seg" role="tablist" aria-label="Time range" id="seg">
          <button role="tab" data-days="7" aria-selected="false">1W</button>
          <button role="tab" data-days="30" aria-selected="true">1M</button>
          <button role="tab" data-days="90" aria-selected="false">3M</button>
          <button role="tab" data-days="365" aria-selected="false">1Y</button>
        </div>
        <figure>
          <svg id="chart" role="img" aria-label="Weight chart"></svg>
          <div class="chart-empty" id="chartEmpty" hidden>No entries in this range</div>
          <figcaption id="xlabels"></figcaption>
        </figure>
      </section>

      <section class="stats">
        <div class="stat"><span>Start</span><span id="sStart">–</span></div>
        <div class="stat"><span>Lowest</span><span id="sLow">–</span></div>
        <div class="stat"><span>Change</span><span id="sChange">–</span></div>
      </section>

      <section class="history">
        <h2>History</h2>
        <ul id="list"></ul>
        <button class="more" id="moreBtn" hidden>Show all</button>
      </section>
    </div>
  </div>
</main>

<div class="fab-wrap">
  <button class="fab" id="addBtn" aria-label="Add weight entry">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
  </button>
</div>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="entrySheet" role="dialog" aria-modal="true" aria-labelledby="entryTitle">
  <div class="handle"></div>
  <div class="sheet-head">
    <button class="text-btn" id="cancelBtn">Cancel</button>
    <h2 id="entryTitle">New entry</h2>
    <button class="text-btn danger" id="deleteBtn" hidden>Delete</button>
  </div>
  <div class="chips">
    <label class="chip">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>
      <input type="date" id="dateIn" aria-label="Date">
    </label>
    <label class="chip">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <input type="time" id="timeIn" aria-label="Time">
    </label>
  </div>
  <div class="readout">
    <div class="big" aria-live="polite"><span class="num" id="readNum">0</span><span class="caret"></span><span class="unit">kg</span></div>
    <span class="hint" id="hint"></span>
  </div>
  <div class="pad" id="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="." class="ghost">.</button><button data-k="0">0</button>
    <button data-k="del" class="ghost" aria-label="Delete digit">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"/><path d="M12 9l5 6"/><path d="M17 9l-5 6"/></svg>
    </button>
  </div>
  <button class="primary" id="saveBtn" disabled>Save</button>
</section>

<section class="sheet" id="menuSheet" role="dialog" aria-modal="true" aria-label="Your data">
  <div class="handle"></div>
  <div class="menu-list">
    <button class="menu-item" id="exportBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
      Export as CSV
    </button>
    <button class="menu-item" id="importBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
      Import from CSV
    </button>
    <button class="menu-item" id="menuClose" style="justify-content:center;color:var(--sub)">Close</button>
  </div>
  <p class="menu-note">Your data stays on this iPhone. Export a backup now and then.<br>Gubby <span id="appVersion"></span></p>
  <input type="file" id="fileIn" accept=".csv,text/csv" hidden>
</section>

<div class="cheer" id="cheer" role="dialog" aria-modal="true" aria-labelledby="cheerTitle" hidden>
  <div class="cheer-card">
    <div class="cheer-art" id="cheerArt" aria-hidden="true"></div>
    <h2 id="cheerTitle"></h2>
    <p id="cheerText"></p>
    <span class="pill neutral" id="cheerDiff"></span>
    <button class="primary" id="cheerBtn">Thanks, Gubby</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';
  const DAY = 86400000;
  const $ = (id) => document.getElementById(id);

  // ---------- Storage (IndexedDB) ----------
  const DB_NAME = 'weight-log', STORE = 'entries';
  let dbp;
  function db() {
    if (!dbp) dbp = new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: 'id' });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function tx(mode, fn) {
    const d = await db();
    return new Promise((res, rej) => {
      const t = d.transaction(STORE, mode);
      const out = fn(t.objectStore(STORE));
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined);
      t.onerror = () => rej(t.error);
    });
  }
  const getAll = () => tx('readonly', (s) => s.getAll());
  const putEntry = (e) => tx('readwrite', (s) => s.put(e));
  const delEntry = (id) => tx('readwrite', (s) => s.delete(id));
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  // ---------- Helpers ----------
  const fmt = (n) => n.toFixed(2);
  const round2 = (n) => Math.round(n * 100) / 100;
  const startOfDay = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const pad2 = (n) => String(n).padStart(2, '0');
  const dateVal = (t) => { const d = new Date(t); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
  const timeVal = (t) => { const d = new Date(t); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
  const shortDate = (t) => new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  function dayLabel(t) {
    const diff = Math.round((startOfDay(Date.now()) - startOfDay(t)) / DAY);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    return new Date(t).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  }
  function toast(msg) {
    const el = $('toast'); el.textContent = msg; el.classList.add('on');
    clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2200);
  }

  // ---------- State ----------
  let entries = [];      // sorted ascending by ts
  let rangeDays = 30;
  let showAll = false;
  try { rangeDays = Number(localStorage.getItem('range')) || 30; } catch (e) {}

  async function load() {
    entries = (await getAll()).sort((a, b) => a.ts - b.ts);
    render();
  }

  // Daily averages + trailing 7-day moving average
  function dailySeries() {
    const map = new Map();
    for (const e of entries) {
      const k = startOfDay(e.ts);
      const v = map.get(k) || { t: k, sum: 0, n: 0 };
      v.sum += e.kg; v.n += 1; map.set(k, v);
    }
    const days = [...map.values()].sort((a, b) => a.t - b.t).map((d) => ({ t: d.t, kg: d.sum / d.n }));
    for (let i = 0; i < days.length; i++) {
      let s = 0, n = 0;
      for (let j = i; j >= 0 && days[i].t - days[j].t < 7 * DAY; j--) { s += days[j].kg; n++; }
      days[i].ma = s / n;
    }
    return days;
  }

  // ---------- Render ----------
  function render() {
    $('today').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
    const has = entries.length > 0;
    $('empty').hidden = has;
    $('dash').hidden = !has;
    if (!has) return;

    const latest = entries[entries.length - 1];
    $('latest').textContent = fmt(latest.kg);

    // Delta: vs the most recent entry at least 7 days older than the latest
    let ref = null, label = 'this week';
    for (let i = entries.length - 1; i >= 0; i--) if (entries[i].ts <= latest.ts - 7 * DAY) { ref = entries[i]; break; }
    if (!ref && entries.length > 1) { ref = entries[0]; label = 'since start'; }
    const pill = $('delta');
    if (ref) {
      const d = latest.kg - ref.kg;
      pill.hidden = false;
      pill.classList.toggle('up', d > 0.004);
      pill.classList.toggle('neutral', d > -0.005);
      $('deltaText').textContent = Math.abs(d) < 0.005 ? `No change ${label}` : `${fmt(Math.abs(d))} kg ${label}`;
      pill.querySelector('svg').style.display = Math.abs(d) < 0.005 ? 'none' : '';
    } else pill.hidden = true;

    const days = dailySeries();
    $('avg').textContent = days.length > 1 ? `7-day avg ${fmt(days[days.length - 1].ma)}` : '';

    // Range
    document.querySelectorAll('#seg button').forEach((b) => b.setAttribute('aria-selected', String(Number(b.dataset.days) === rangeDays)));
    const end = startOfDay(Date.now());
    const start = end - (rangeDays - 1) * DAY;
    const inRange = days.filter((d) => d.t >= start);
    const rangeEntries = entries.filter((e) => e.ts >= start);
    drawChart(inRange, start, end);

    if (rangeEntries.length) {
      const first = rangeEntries[0].kg;
      const low = Math.min(...rangeEntries.map((e) => e.kg));
      const ch = latest.kg - first;
      $('sStart').textContent = fmt(first);
      $('sLow').textContent = fmt(low);
      const c = $('sChange');
      c.textContent = (ch > 0 ? '+' : ch < 0 ? '−' : '') + fmt(Math.abs(ch));
      c.className = ch < 0 ? 'good' : '';
    } else { $('sStart').textContent = $('sLow').textContent = $('sChange').textContent = '–'; }

    // History
    const list = $('list'); list.textContent = '';
    const desc = entries.slice().reverse();
    const shown = showAll ? desc : desc.slice(0, 7);
    for (const e of shown) {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.className = 'row'; b.setAttribute('aria-label', `Edit ${dayLabel(e.ts)} ${timeVal(e.ts)}, ${fmt(e.kg)} kilograms`);
      b.innerHTML = '<span class="when"><span class="day"></span><span class="time"></span></span><span class="kg"><span class="v"></span> <small>kg</small></span>';
      b.querySelector('.day').textContent = dayLabel(e.ts);
      b.querySelector('.time').textContent = timeVal(e.ts);
      b.querySelector('.v').textContent = fmt(e.kg);
      b.addEventListener('click', () => openEntry(e));
      li.appendChild(b); list.appendChild(li);
    }
    $('moreBtn').hidden = desc.length <= 7;
    $('moreBtn').textContent = showAll ? 'Show less' : `Show all ${desc.length}`;
  }

  // ---------- Chart (hand-drawn SVG) ----------
  const NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs) { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; }
  function smooth(pts) {
    if (pts.length === 1) return `M${pts[0][0]} ${pts[0][1]}`;
    let d = `M${pts[0][0]} ${pts[0][1]}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, pts.length - 1)];
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
    }
    return d;
  }
  function drawChart(days, start, end) {
    const svg = $('chart'), empty = $('chartEmpty'), cap = $('xlabels');
    svg.textContent = '';
    if (!days.length) { svg.style.display = 'none'; empty.hidden = false; cap.textContent = ''; return; }
    svg.style.display = ''; empty.hidden = true;

    const W = svg.clientWidth || 342, H = 190, top = 14, bottom = 10, left = 4, right = 8;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const vals = days.flatMap((d) => [d.kg, d.ma]);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const span = Math.max(hi - lo, 0.6);
    const step = [0.2, 0.5, 1, 2, 5, 10].find((s) => span / s <= 3.5) || 10;
    lo = Math.floor((lo - span * 0.12) / step) * step;
    hi = Math.ceil((hi + span * 0.12) / step) * step;
    const x = (t) => end === start ? W / 2 : left + (t - start) / (end - start) * (W - left - right);
    const y = (v) => top + (hi - v) / (hi - lo) * (H - top - bottom);

    const defs = el('defs', {});
    const g = el('linearGradient', { id: 'fade', x1: 0, y1: 0, x2: 0, y2: 1 });
    g.appendChild(el('stop', { offset: 0, 'stop-color': 'var(--line)', 'stop-opacity': 0.2 }));
    g.appendChild(el('stop', { offset: 1, 'stop-color': 'var(--line)', 'stop-opacity': 0 }));
    defs.appendChild(g); svg.appendChild(defs);

    for (let v = lo + step; v < hi - step / 2; v += step) {
      svg.appendChild(el('line', { x1: 0, x2: W, y1: y(v), y2: y(v), stroke: 'var(--grid)', 'stroke-dasharray': '2 4' }));
      const t = el('text', { x: 0, y: y(v) - 5 }); t.textContent = (step < 1 ? v.toFixed(1) : v.toFixed(0)); svg.appendChild(t);
    }

    const pts = days.map((d) => [x(d.t), y(d.ma)]);
    const line = smooth(pts);
    if (pts.length > 1) svg.appendChild(el('path', { d: `${line} L${pts[pts.length - 1][0]} ${H} L${pts[0][0]} ${H} Z`, fill: 'url(#fade)' }));
    days.forEach((d, i) => { if (i < days.length - 1) svg.appendChild(el('circle', { cx: x(d.t), cy: y(d.kg), r: 2.5, fill: 'var(--dot)' })); });
    if (pts.length > 1) svg.appendChild(el('path', { d: line, fill: 'none', stroke: 'var(--line)', 'stroke-width': 2.5, 'stroke-linecap': 'round' }));
    const last = days[days.length - 1];
    svg.appendChild(el('circle', { cx: x(last.t), cy: y(last.kg), r: 9, fill: 'var(--line)', 'fill-opacity': 0.18 }));
    svg.appendChild(el('circle', { cx: x(last.t), cy: y(last.kg), r: 4.5, fill: 'var(--line)', stroke: 'var(--bg)', 'stroke-width': 2 }));

    svg.setAttribute('aria-label', `Weight over the last ${rangeDays} days, from ${fmt(days[0].kg)} to ${fmt(last.kg)} kg`);
    const mid = start + (end - start) / 2;
    cap.innerHTML = '<span></span><span></span><span>Today</span>';
    cap.children[0].textContent = shortDate(start);
    cap.children[1].textContent = shortDate(mid);
  }

  // ---------- Sheets ----------
  let openSheetEl = null;
  function openSheet(s) { openSheetEl = s; $('scrim').classList.add('on'); s.classList.add('on'); }
  function closeSheet() { if (!openSheetEl) return; openSheetEl.classList.remove('on'); $('scrim').classList.remove('on'); openSheetEl = null; }
  $('scrim').addEventListener('click', closeSheet);

  // ---------- Entry sheet ----------
  let buf = '', editing = null, armedDelete = false;
  function openEntry(entry) {
    editing = entry || null;
    const t = entry ? entry.ts : Date.now();
    $('dateIn').value = dateVal(t);
    $('timeIn').value = timeVal(t);
    buf = entry ? fmt(entry.kg) : '';
    $('entryTitle').textContent = entry ? 'Edit entry' : 'New entry';
    $('deleteBtn').hidden = !entry;
    armedDelete = false; $('deleteBtn').textContent = 'Delete';
    updateEntry();
    openSheet($('entrySheet'));
  }
  function sheetTs() {
    const [y, m, d] = ($('dateIn').value || dateVal(Date.now())).split('-').map(Number);
    const [hh, mm] = ($('timeIn').value || timeVal(Date.now())).split(':').map(Number);
    return new Date(y, m - 1, d, hh, mm).getTime();
  }
  function updateEntry() {
    const ts = sheetTs();
    const prev = entries.filter((e) => e.ts < ts && (!editing || e.id !== editing.id)).pop();
    const num = $('readNum');
    if (buf) { num.textContent = buf; num.classList.remove('placeholder'); }
    else { num.textContent = prev ? fmt(prev.kg) : '0.00'; num.classList.add('placeholder'); }
    const v = parseFloat(buf);
    const valid = buf !== '' && !buf.endsWith('.') && v >= 20 && v <= 400;
    $('saveBtn').disabled = !valid;
    let hint = '';
    if (!buf) hint = prev ? 'Last entry shown — type your weight' : 'Type your weight';
    else if (!valid) hint = v > 400 || buf.length >= 3 && v < 20 ? 'Enter a weight between 20 and 400 kg' : '';
    else if (prev) {
      const d = round2(v - prev.kg);
      hint = d === 0 ? 'Same as last entry' : `${fmt(Math.abs(d))} kg ${d < 0 ? 'lower' : 'higher'} than last entry`;
    }
    $('hint').textContent = hint;
  }
  function press(k) {
    if (k === 'del') buf = buf.slice(0, -1);
    else if (k === '.') { if (!buf.includes('.')) buf = (buf || '0') + '.'; }
    else {
      const [i, dec] = buf.split('.');
      if (dec !== undefined) { if (dec.length < 2) buf += k; }
      else if (i.length < 3) buf = (buf === '0' ? '' : buf) + k;
    }
    updateEntry();
  }
  $('pad').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) press(b.dataset.k); });
  document.addEventListener('keydown', (e) => {
    if (openSheetEl !== $('entrySheet') || e.target.tagName === 'INPUT') return;
    if (/^[0-9.]$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') press('del');
    else if (e.key === 'Enter' && !$('saveBtn').disabled) $('saveBtn').click();
    else if (e.key === 'Escape') closeSheet();
  });
  for (const id of ['dateIn', 'timeIn']) {
    const inp = $(id);
    inp.addEventListener('input', updateEntry);
    inp.addEventListener('change', updateEntry);
    // Open the native picker when the chip is tapped (where the browser supports it)
    // Tapping the chip's icon or padding opens the picker. Clicks on the field
    // itself are left alone, so the hour and minute parts can each be edited.
    inp.closest('.chip').addEventListener('click', (e) => {
      if (e.target === inp) return;
      e.preventDefault();
      inp.focus();
      try { if (inp.showPicker) inp.showPicker(); } catch (err) {}
    });
  }
  $('cancelBtn').addEventListener('click', closeSheet);
  $('addBtn').addEventListener('click', () => openEntry(null));
  $('saveBtn').addEventListener('click', async () => {
    const entry = { id: editing ? editing.id : (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()), ts: sheetTs(), kg: round2(parseFloat(buf)) };
    const isNew = !editing;
    const prevEntry = entries.filter((e) => e.ts < entry.ts && e.id !== entry.id).pop();
    await putEntry(entry);
    closeSheet(); await load();
    if (isNew) showCheer(prevEntry ? round2(entry.kg - prevEntry.kg) : null);
    else toast('Entry updated');
  });
  $('deleteBtn').addEventListener('click', async () => {
    if (!armedDelete) {
      armedDelete = true; $('deleteBtn').textContent = 'Confirm';
      setTimeout(() => { armedDelete = false; $('deleteBtn').textContent = 'Delete'; }, 3000);
      return;
    }
    await delEntry(editing.id);
    closeSheet(); await load(); toast('Entry deleted');
  });


  // ---------- Cheer-up pop-up ----------
  const CHEERS = {
    celebrate: [
      ['Congratulations!', 'You’re getting lighter, and Gubby is so proud of you.', 'jump'],
      ['Well done!', 'Every small step adds up, and this one counts.', 'thumbs'],
      ['Look at you go!', 'Your hard work is showing.', 'run'],
      ['Yay, progress!', 'Gubby is doing a happy dance for you.', 'dance'],
      ['Amazing!', 'Keep it up — you’re on the right track.', 'twirl']
    ],
    cheer: [
      ['You can do it!', 'One number doesn’t define your journey.', 'pump'],
      ['Keep your head up!', 'Tomorrow is a fresh start.', 'sunrise'],
      ['Don’t give up!', 'Gubby believes in you.', 'hug'],
      ['Small bump, big picture.', 'Look at your trend line, not just today.', 'chart'],
      ['Try again tomorrow!', 'Progress is never a straight line.', 'sleepy']
    ],
    steady: [['Holding steady!', 'Consistency is a win too.', 'steady']],
    first: [['First step done!', 'Gubby will cheer you on every day from now on.', 'jump']]
  };

  // ---------- Gubby, drawn in SVG ----------
  const PINK = '#F2A9C0', INK = '#2A1F25', BERRY = '#B04A6E', ROSE = '#D9789A', MAUVE = '#E8A0B8', GOLD = '#F5C26B';
  const STAR = 'M0 -8 L2.2 -2.2 L8 0 L2.2 2.2 L0 8 L-2.2 2.2 L-8 0 L-2.2 -2.2Z';
  const HEART = 'M0 4 C0 -1 7 -2 8 3 C9 -2 16 -1 16 4 C16 9 8 13 8 15 C8 13 0 9 0 4Z';
  const arm = (x1, y1, x2, y2, cls = '') =>
    `<line class="${cls}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${PINK}" stroke-width="17" stroke-linecap="round"/>`;
  const restArms = arm(38, 124, 28, 144) + arm(162, 124, 172, 144);
  const at = (x, y, inner, scale = 1) => `<g transform="translate(${x} ${y}) scale(${scale})">${inner}</g>`;
  const delay = (d) => `style="animation-delay:${d}s"`;
  const eyes = (dx = 0, dy = 0) => `<ellipse cx="${80 + dx}" cy="${112 + dy}" rx="6" ry="7.5" fill="${INK}"/><ellipse cx="${120 + dx}" cy="${112 + dy}" rx="6" ry="7.5" fill="${INK}"/>
      <circle cx="${82.5 + dx}" cy="${108.5 + dy}" r="2.2" fill="#fff"/><circle cx="${122.5 + dx}" cy="${108.5 + dy}" r="2.2" fill="#fff"/>`;
  const happyEyes = `<path d="M71 113 q9 -11 18 0 M111 113 q9 -11 18 0" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  const smile = `<path d="M92 126 q8 6 16 0" stroke="${INK}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
  const openSmile = `<path d="M89 124 q11 16 22 0 z" fill="#9A3A5C"/>`;
  const sparks = (pts) => pts.map(([x, y, sc, d, c]) => at(x, y, `<path class="g-spark fb" d="${STAR}" fill="${c}" ${delay(d)}/>`, sc)).join('');

  const POSES = {
    jump() {
      const bits = [[30, BERRY, 0, 'r'], [60, ROSE, .5, 'c'], [92, MAUVE, 1.1, 'r'], [118, BERRY, .3, 'c'], [146, ROSE, .9, 'r'], [172, MAUVE, 1.4, 'c'], [46, '#C9668A', 1.3, 'c'], [160, '#C9668A', .7, 'r']];
      return {
        arms: arm(42, 112, 20, 78, 'g-armL') + arm(158, 112, 180, 78, 'g-armR'),
        face: happyEyes + openSmile,
        fx: bits.map(([x, c, d, k]) => k === 'r'
          ? `<rect class="g-confetti fb" x="${x}" y="10" width="7" height="11" rx="2" fill="${c}" ${delay(d)}/>`
          : `<circle class="g-confetti fb" cx="${x}" cy="14" r="4.5" fill="${c}" ${delay(d)}/>`).join('')
      };
    },
    thumbs() {
      return {
        arms: arm(38, 124, 28, 144),
        front: `<g class="g-thumb">${arm(150, 128, 176, 104)}<circle cx="180" cy="100" r="12" fill="${PINK}"/>
          <line x1="180" y1="92" x2="180" y2="76" stroke="${PINK}" stroke-width="10" stroke-linecap="round"/></g>`,
        face: `<path d="M71 113 q9 -11 18 0" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round"/>
          <ellipse cx="120" cy="112" rx="6" ry="7.5" fill="${INK}"/><circle cx="122.5" cy="108.5" r="2.2" fill="#fff"/>` + openSmile,
        fx: sparks([[196, 70, 1, 0, BERRY], [168, 62, .6, .6, ROSE]])
      };
    },
    run() {
      return {
        arms: arm(42, 118, 30, 146, 'g-armL') + arm(158, 118, 170, 146, 'g-armR'),
        face: eyes(4, 0) + openSmile,
        fx: [100, 120, 140].map((y, i) => `<line class="g-speed fb" x1="2" y1="${y}" x2="${i === 1 ? 26 : 18}" y2="${y}" stroke="${MAUVE}" stroke-width="5" stroke-linecap="round" ${delay(i * .15)}/>`).join('')
      };
    },
    dance() {
      const note = `<ellipse cx="0" cy="10" rx="5.5" ry="4.2" fill="${BERRY}"/><line x1="5" y1="10" x2="5" y2="-7" stroke="${BERRY}" stroke-width="2.5"/><path d="M5 -7 q7 2 7 9" stroke="${BERRY}" stroke-width="2.5" fill="none"/>`;
      return {
        arms: arm(42, 112, 18, 84, 'g-armL') + arm(158, 112, 182, 84, 'g-armR'),
        face: happyEyes + openSmile,
        fx: at(28, 40, `<g class="g-note fb">${note}</g>`) + at(172, 34, `<g class="g-note fb" ${delay(.7)}>${note}</g>`, .8) + at(150, 18, `<g class="g-note fb" ${delay(1.3)}>${note}</g>`, .7)
      };
    },
    twirl() {
      const starEye = (x) => at(x, 112, `<path d="M0 -9 L2.6 -2.6 L9 0 L2.6 2.6 L0 9 L-2.6 2.6 L-9 0 L-2.6 -2.6Z" fill="${BERRY}"/>`);
      return {
        arms: arm(40, 118, 14, 108) + arm(160, 118, 186, 108),
        face: starEye(80) + starEye(120) + openSmile,
        fx: sparks([[24, 50, 1, 0, BERRY], [180, 44, .9, .5, ROSE], [190, 130, .7, .9, MAUVE], [12, 140, .7, 1.2, ROSE], [100, 18, .6, .3, BERRY]])
      };
    },
    pump() {
      return {
        arms: arm(38, 124, 26, 142) + `<g class="g-pump">${arm(160, 112, 182, 80)}<circle cx="183" cy="77" r="11" fill="${PINK}"/></g>`,
        face: eyes() + `<path d="M71 100 l14 2.5 M129 100 l-14 2.5" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>` + smile,
        fx: sparks([[196, 54, 1, 0, BERRY], [166, 46, .7, .5, ROSE], [200, 92, .6, .9, MAUVE]])
      };
    },
    sunrise() {
      const rays = [0, 45, 90, 135, 180, 225, 270, 315].map((a) => `<line x1="160" y1="40" x2="160" y2="32" stroke="${GOLD}" stroke-width="4" stroke-linecap="round" transform="rotate(${a} 160 64)"/>`).join('');
      return {
        back: `<g class="g-sun fb"><g class="g-rays">${rays}</g><circle cx="160" cy="64" r="17" fill="${GOLD}"/></g>`,
        arms: restArms,
        face: eyes(5, -5) + smile
      };
    },
    hug() {
      return {
        arms: '',
        front: `<path class="g-bigheart" d="M100 160 C78 146 72 132 82 124 C90 118 98 122 100 130 C102 122 110 118 118 124 C128 132 122 146 100 160Z" fill="${BERRY}"/>
          ${arm(46, 124, 80, 146)}${arm(154, 124, 120, 146)}`,
        face: happyEyes + smile,
        fx: at(150, 44, `<path class="g-heart fb" d="${HEART}" fill="${ROSE}"/>`) + at(34, 56, `<path class="g-heart fb" d="${HEART}" fill="${MAUVE}" ${delay(1.2)}/>`, .7)
      };
    },
    chart() {
      return {
        back: `<rect x="-36" y="22" width="76" height="54" rx="12" fill="#FFFFFF" stroke="#EEDFE0" stroke-width="2"/>
          <polyline class="g-trend" points="-26,36 -15,46 -5,40 6,54 17,50 30,64" fill="none" stroke="${ROSE}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="30" cy="64" r="4" fill="${BERRY}"/>`,
        arms: arm(162, 124, 172, 144) + `<g class="g-point">${arm(42, 112, 22, 88)}<circle cx="19" cy="84" r="10" fill="${PINK}"/></g>`,
        face: eyes(-5, -3) + smile
      };
    },
    sleepy() {
      const z = (x, y, sz, d) => `<text class="g-z fb" x="${x}" y="${y}" font-size="${sz}" font-weight="700" fill="${BERRY}" font-family="-apple-system, system-ui, sans-serif" ${delay(d)}>z</text>`;
      return {
        arms: restArms,
        face: `<path d="M72 113 q8 6 16 0 M112 113 q8 6 16 0" stroke="${INK}" stroke-width="4.5" fill="none" stroke-linecap="round"/>
          <ellipse cx="100" cy="129" rx="4.5" ry="5.5" fill="#9A3A5C"/>`,
        fx: at(176, 34, `<path d="M0 -15 a15 15 0 1 0 13 22 a12 12 0 1 1 -13 -22z" fill="${GOLD}"/>`) +
          z(142, 62, 22, 0) + z(158, 44, 16, .9) + z(128, 40, 13, 1.7)
      };
    },
    steady() {
      return {
        arms: restArms,
        face: eyes() + smile,
        fx: at(150, 40, `<path class="g-heart fb" d="${HEART}" fill="${ROSE}"/>`) + at(36, 54, `<path class="g-heart fb" d="${HEART}" fill="${MAUVE}" ${delay(1.2)}/>`, .7)
      };
    }
  };

  function gubbySVG(pose) {
    const p = (POSES[pose] || POSES.steady)();
    return `<svg viewBox="0 0 200 200" class="pose-${pose}">
      <ellipse class="g-shadow" cx="100" cy="186" rx="54" ry="7" fill="#EBC6D3" opacity=".8"/>
      ${p.back || ''}
      <g class="g-body">
        <ellipse class="g-footL fb" cx="76" cy="176" rx="20" ry="10" fill="#E896B0"/><ellipse class="g-footR fb" cx="124" cy="176" rx="20" ry="10" fill="#E896B0"/>
        ${p.arms || ''}
        <ellipse cx="100" cy="118" rx="68" ry="62" fill="${PINK}"/>
        <ellipse cx="100" cy="112" rx="62" ry="55" fill="#F5B7CA"/>
        <g class="g-sprout"><line x1="100" y1="58" x2="100" y2="43" stroke="${BERRY}" stroke-width="5" stroke-linecap="round"/>
          <ellipse cx="88" cy="41" rx="13" ry="6" fill="${BERRY}" transform="rotate(-20 88 41)"/>
          <ellipse cx="113" cy="38" rx="15" ry="7" fill="#C9668A" transform="rotate(15 113 38)"/></g>
        <ellipse cx="62" cy="128" rx="12" ry="7" fill="#E8869F"/><ellipse cx="138" cy="128" rx="12" ry="7" fill="#E8869F"/>
        ${p.face || ''}
        ${p.front || ''}
      </g>
      <g class="g-fx">${p.fx || ''}</g>
    </svg>`;
  }

  const lastPick = {};
  function pick(list, key) {
    let i = Math.floor(Math.random() * list.length);
    if (list.length > 1 && i === lastPick[key]) i = (i + 1) % list.length;
    lastPick[key] = i;
    return list[i];
  }
  function showCheer(diff, force) {
    const mood = diff === null ? 'first' : diff < 0 ? 'celebrate' : diff > 0 ? 'cheer' : 'steady';
    const [title, text, pose] = force !== undefined ? CHEERS[mood][force] : pick(CHEERS[mood], mood);
    $('cheerArt').innerHTML = gubbySVG(pose);
    $('cheerTitle').textContent = title;
    $('cheerText').textContent = text;
    const pill = $('cheerDiff');
    pill.hidden = diff === null;
    if (diff !== null) {
      pill.textContent = diff === 0 ? 'Same as your last entry' : `${diff > 0 ? '+' : '−'}${fmt(Math.abs(diff))} kg since your last entry`;
      pill.className = diff < 0 ? 'pill' : 'pill neutral';
    }
    const c = $('cheer');
    c.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => c.classList.add('on')));
    setTimeout(() => $('cheerBtn').focus(), 50);
  }
  function hideCheer() {
    const c = $('cheer');
    c.classList.remove('on');
    setTimeout(() => { c.hidden = true; $('cheerArt').textContent = ''; }, 260);
  }
  $('cheerBtn').addEventListener('click', hideCheer);
  $('cheer').addEventListener('click', (e) => { if (e.target.id === 'cheer') hideCheer(); });

  // ---------- Range + list ----------
  $('seg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    rangeDays = Number(b.dataset.days);
    try { localStorage.setItem('range', rangeDays); } catch (err) {}
    render();
  });
  $('moreBtn').addEventListener('click', () => { showAll = !showAll; render(); });
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 150); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

  // ---------- Export / import ----------
  $('menuBtn').addEventListener('click', () => openSheet($('menuSheet')));
  $('menuClose').addEventListener('click', closeSheet);
  $('exportBtn').addEventListener('click', async () => {
    if (!entries.length) { toast('Nothing to export yet'); return; }
    const csv = 'date,time,weight_kg\n' + entries.map((e) => `${dateVal(e.ts)},${timeVal(e.ts)},${fmt(e.kg)}`).join('\n') + '\n';
    const name = `gubby-${dateVal(Date.now())}.csv`;
    const file = new File([csv], name, { type: 'text/csv' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Gubby data' }); closeSheet(); return; }
    } catch (err) { if (err.name === 'AbortError') return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    closeSheet();
  });
  $('importBtn').addEventListener('click', () => $('fileIn').click());
  $('fileIn').addEventListener('change', async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const text = await f.text();
    const have = new Set(entries.map((x) => x.ts));
    let added = 0;
    for (const line of text.split(/\r?\n/)) {
      const m = line.trim().match(/^(\d{4})-(\d{2})-(\d{2}),(\d{1,2}):(\d{2}),(\d+(?:\.\d+)?)$/);
      if (!m) continue;
      const ts = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]).getTime();
      const kg = round2(parseFloat(m[6]));
      if (have.has(ts) || kg < 20 || kg > 400) continue;
      await putEntry({ id: crypto.randomUUID ? crypto.randomUUID() : String(ts) + Math.random(), ts, kg });
      have.add(ts); added++;
    }
    e.target.value = '';
    closeSheet(); await load();
    toast(added ? `Imported ${added} ${added === 1 ? 'entry' : 'entries'}` : 'No new entries found');
  });

  // ---------- Offline ----------
  // ---------- Offline + automatic updates ----------
  const APP_VERSION = 'v6';
  $('appVersion').textContent = APP_VERSION;
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    const hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    // When a new version takes over, reload once so it shows straight away
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloaded) return;
      reloaded = true; location.reload();
    });
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
      // Check for a new version every time the app comes back to the screen
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch(() => {});
  }

  load();
})();
</script>
</body>
</html>
